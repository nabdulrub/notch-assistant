name: CI

on:
  pull_request:
  push:
    branches: [main]

# Pull requests from forks run this with a read-only token and no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers -productVersion && xcodebuild -version && swift --version
      - name: Build and test
        working-directory: apps/mac
        run: swift test

  plugin:
    name: Plugin script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sh -n plugins/herdr/notch.sh
